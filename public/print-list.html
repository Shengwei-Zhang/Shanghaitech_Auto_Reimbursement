<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>报销单打印 · 报销助手</title>
  <link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/easy.css"><link rel="stylesheet" href="/easy-v2.css">
  <script src="/print-list.js" defer></script>
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand"><span class="mark">报</span><div><strong>报销单打印</strong><small>报销助手 · Reimbursement Copilot</small></div></div>
      <div class="account">
        <a class="nav-pill" href="/"><span class="pill-icon" aria-hidden="true">←</span>返回报销助手</a>
        <div class="user-chip">
          <span id="account-avatar" class="avatar" aria-hidden="true"></span>
          <span class="who"><strong id="account-name"></strong><span class="mono"><span id="account-id"></span></span></span>
        </div>
      </div>
    </header>

    <main>
      <div id="message" class="message" role="status" hidden></div>

      <section id="print-card" class="card">
        <h2>需要打印的报销单 <span id="print-count" class="badge" hidden></span></h2>
        <p class="hint small">向 OA“报销单查询”只查询状态为“提交”的最近 100 张报销单（含用款申请单、境内差旅单、采购预付及报销单等），再逐张向 OA 确认能否打印，只列出允许打印的。所选报销单合并成一个打印页面，每张单从新的一页开始，内容与 OA“打印”按钮相同，包括水印。</p>
        <div class="print-tools">
          <input id="print-search" type="search" placeholder="按单号、报销类别、事由、金额或日期筛选">
          <button id="print-all" type="button">全选</button>
          <button id="print-refresh" type="button">重新读取</button>
          <button id="print-download" type="button" disabled>下载所选</button>
          <button id="print-go" type="button" class="primary" disabled>打印所选</button>
        </div>
        <p id="print-status" class="hint small"></p>
        <div class="print-scroll">
          <table class="invoices print-table">
            <thead><tr><th></th><th>单号</th><th>报销类别</th><th>填单日期</th><th class="num">报销金额</th><th>事由</th><th class="actions">操作</th></tr></thead>
            <tbody id="print-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
